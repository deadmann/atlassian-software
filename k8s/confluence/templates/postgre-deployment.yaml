apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-confluence
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-confluence
  template:
    metadata:
      labels:
        app: postgres-confluence
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: confluence-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confluence-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: confluence-db-secret
                  key: POSTGRES_DB

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: postgres-data
              # FIX (2026-10-15): postgres:16 stores data in /var/lib/postgresql/data and
              # declares it as an image VOLUME. Mounting the PVC at the parent dir
              # (/var/lib/postgresql) left the DB in the container's own volume, so it was
              # lost on container restart. Mount the PVC exactly on the data dir instead.
              # Jira was unaffected because postgres:18 uses /var/lib/postgresql/18/docker.
              # TODO: upgrade to postgres:18 (pg_dump/pg_restore into a new PV) once
              #       Confluence supports it; then change this back to /var/lib/postgresql.
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-confluence-data-pvc
